databases:
  - name: sat-bot-db
    databaseName: sat_bot
    user: sat_bot_user
    plan: free

services:
  - type: web
    name: sat-notify-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: TZ
        value: Asia/Tashkent
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: sat-bot-db
          property: connectionString
      - key: DB_PATH
        sync: false
